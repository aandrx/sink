name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if ([pkg.version, manifest.version, lock.version, lock.packages[""].version].some(value => value !== version)) {
              throw new Error("Release tag and package/manifest/lock versions must match");
            }
            if (!fs.existsSync(`docs/releases/${version}.md`)) throw new Error("Missing release notes");
          '

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Locate release notes
        id: notes
        run: echo "path=docs/releases/${GITHUB_REF_NAME#v}.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            main.js
            manifest.json
            styles.css
